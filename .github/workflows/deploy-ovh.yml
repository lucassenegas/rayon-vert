name: Deploy to OVH

# Construit le site et publie le resultat (le contenu de dist/) sur une
# branche dediee. C'est cette branche que l'hebergement mutualise OVH
# clone : il ne sait pas executer `npm run build`, il ne sert que des
# fichiers deja compiles.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-ovh
  cancel-in-progress: true

env:
  # Domaine servi par l'hebergement OVH, sans slash final.
  SITE_URL: https://hotels-deshaies.com
  # Branche a associer dans le panel OVH.
  DEPLOY_BRANCH: ovh
  # URL de base figee dans les HTML par le deploiement GitHub Pages.
  PAGES_URL: https://lucassenegas.github.io/rayon-vert

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Pas de VITE_BASE : vite.config.ts retombe sur '/', le site est
      # servi a la racine du domaine OVH et non dans un sous-dossier.
      - name: Build
        run: npm run build

      - name: Pointer les URLs canoniques vers le domaine OVH
        run: |
          # Les balises canonical / og:url / og:image sont ecrites en dur
          # pour GitHub Pages dans les sources. Laissees telles quelles,
          # elles designeraient github.io comme version de reference du
          # site, ce qui saboterait le referencement du domaine OVH.
          find dist -name '*.html' -exec \
            perl -pi -e 's/\Q$ENV{PAGES_URL}\E/$ENV{SITE_URL}/g' {} +
          if grep -rl 'github\.io' dist --include='*.html'; then
            echo "::error::Des URLs GitHub Pages subsistent dans le build"
            exit 1
          fi

      - name: Publier le build sur la branche de deploiement
        run: |
          cd dist
          git init -b "$DEPLOY_BRANCH"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          # On repart du dernier deploiement pour garder un historique
          # lineaire : OVH peut faire un `git pull`, qu'un force-push
          # casserait. `reset --soft` deplace HEAD sans toucher a l'index,
          # donc l'arbre publie reste exactement le contenu de dist/.
          if git fetch --depth=1 origin "$DEPLOY_BRANCH"; then
            git reset --soft FETCH_HEAD
          fi

          git add -A
          if git diff --cached --quiet; then
            echo 'Build identique au precedent, rien a publier'
            exit 0
          fi
          git commit -m "Build de ${{ github.sha }}"
          git push origin "HEAD:$DEPLOY_BRANCH"
